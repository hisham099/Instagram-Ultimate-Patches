name: Port unit tests

on:
  push:
    paths:
      - "patches/ports/oxbow-clean-links/**"
      - ".github/workflows/port-unit-tests.yml"
  pull_request:
    paths:
      - "patches/ports/oxbow-clean-links/**"
      - ".github/workflows/port-unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oxbow-clean-links:
    name: Oxbow clean-links utility (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile with all warnings treated as errors
        run: |
          mkdir -p build/clean-links-test
          javac -Xlint:all -Werror \
            -d build/clean-links-test \
            patches/ports/oxbow-clean-links/src/main/java/com/iup/extension/privacy/InstagramShareLinkCleaner.java \
            patches/ports/oxbow-clean-links/src/test/java/com/iup/extension/privacy/InstagramShareLinkCleanerTest.java

      - name: Run regression tests
        run: |
          java -cp build/clean-links-test \
            com.iup.extension.privacy.InstagramShareLinkCleanerTest
