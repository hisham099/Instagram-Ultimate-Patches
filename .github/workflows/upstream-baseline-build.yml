name: IUP integrated MPP build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "patches/catalog.json"
      - "patches/src/**"
      - "extensions/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "scripts/**"
      - "extensions/shared/library/src/main/l10n/**"
      - ".github/workflows/upstream-baseline-build.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: iup-integrated-mpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-upstream-baseline:
    name: Build integrated IUP MPP
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout this integration repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Space-separated package IDs; do not request the removed legacy "tools" package.
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Python for localization generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate bilingual localization catalog
        run: python scripts/gen-l10n.py
      - name: Verify imported source pin
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"commit": "da56d39d7c001bf052bcb7951e3051224bd39928"' third_party/hushgram/UPSTREAM-PIN.json
          grep -F 'INSTAGRAM_TARGET_VERSION = "456.0.0.53.78"' patches/src/main/kotlin/app/morphe/patches/shared/compat/AppCompatibilities.kt

      - name: Bootstrap missing Linux AAPT2 verification checksum
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # The pinned upstream verification file records the Windows AAPT2
          # artifact but omits the Linux classifier used by this runner.
          # Ask Gradle to record SHA-256 metadata for the exact failing resource
          # task, then require that the Linux artifact entry was generated.
          ./gradlew --no-daemon --write-verification-metadata sha256 :extensions:instagram:compileReleaseNavigationResources
          grep -F 'aapt2-9.1.0-14792394-linux.jar' gradle/verification-metadata.xml
          grep -A2 -B1 -F 'aapt2-9.1.0-14792394-linux.jar' gradle/verification-metadata.xml | grep -F '<sha256 value='

      - name: Generate IUP patch catalog and build integrated MPP
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :patches:generatePatchesList :patches:buildAndroid

      - name: Verify release outputs exist
        shell: bash
        run: |
          set -euo pipefail
          test -s patches/build/release/patches-0.0.21.mpp
          test -s patches/build/release/bundle.sha256
          test -s patches/build/release/patches-0.0.21.cdx.json
          sha256sum patches/build/release/patches-0.0.21.mpp
          cat patches/build/release/bundle.sha256

      - name: Upload integrated IUP MPP and SBOM
        uses: actions/upload-artifact@v4
        with:
          name: iup-integrated-0.0.21-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            patches/build/release/patches-0.0.21.mpp
            patches/build/release/patches-0.0.21.cdx.json
            patches/build/release/bundle.sha256
